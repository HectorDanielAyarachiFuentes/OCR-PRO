<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    
    <defs>
        <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f0f2f5"/>
        </linearGradient>
        
        <linearGradient id="scanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(0, 114, 255, 0)"/>
            <stop offset="50%" stop-color="rgba(0, 114, 255, 0.3)"/>
            <stop offset="100%" stop-color="rgba(0, 114, 255, 0.8)"/>
        </linearGradient>
        
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
        </filter>

        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#333333"/>
            <stop offset="100%" stop-color="#666666"/>
        </linearGradient>
    </defs>

    <!-- Document Base -->
    <rect x="40" y="30" width="120" height="150" rx="12" fill="url(#docGradient)" stroke="#e0e0e0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Document Fold (Top Right) -->
    <path d="M120 30 L160 70 L120 70 Z" fill="#e0e0e0" opacity="0.6"/>
    <path d="M120 30 L160 70" stroke="#e0e0e0" stroke-width="2"/>
    <path d="M160 30 L160 70 L120 30 Z" fill="#ffffff"/> <!-- Masking the corner -->
    
    <!-- Text Lines (representing original image text) -->
    <g fill="url(#textGradient)" opacity="0.4">
        <rect x="55" y="60" width="80" height="6" rx="3"/>
        <rect x="55" y="80" width="90" height="6" rx="3"/>
        <rect x="55" y="100" width="70" height="6" rx="3"/>
        <rect x="55" y="120" width="85" height="6" rx="3"/>
        <rect x="55" y="140" width="60" height="6" rx="3"/>
    </g>

    <!-- Scanning Area -->
    <rect x="35" y="70" width="130" height="40" fill="url(#scanGradient)"/>
    
    <!-- Scan Line -->
    <line x1="30" y1="110" x2="170" y2="110" stroke="#0072ff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Recognized Text (Clean, clear text emerging from the scan) -->
    <g fill="#0072ff">
        <rect x="55" y="75" width="80" height="6" rx="3"/>
        <rect x="55" y="95" width="90" height="6" rx="3"/>
    </g>

    <!-- Viewfinder / Lens Focus Corners -->
    <g stroke="#0072ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Top Left -->
        <path d="M50 50 L40 50 L40 60"/>
        <!-- Top Right -->
        <path d="M150 50 L160 50 L160 60"/>
        <!-- Bottom Left -->
        <path d="M40 140 L40 150 L50 150"/>
        <!-- Bottom Right -->
        <path d="M160 140 L160 150 L150 150"/>
    </g>
    
    <!-- Magnifying Glass / Extraction Symbol -->
    <circle cx="100" cy="110" r="15" fill="#ffffff" stroke="#0072ff" stroke-width="3" filter="url(#shadow)"/>
    <!-- OCR Text inside circle -->
    <text x="100" y="113.5" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0072ff" text-anchor="middle">OCR</text>
    
</svg>
