<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 25 140 140" width="100%" height="100%">
    
    <defs>
        <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#f0f2f5"/>
        </linearGradient>
        
        <linearGradient id="scanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(0, 114, 255, 0)"/>
            <stop offset="50%" stop-color="rgba(0, 114, 255, 0.3)"/>
            <stop offset="100%" stop-color="rgba(0, 114, 255, 0.8)"/>
        </linearGradient>
        
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.15"/>
        </filter>

        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#333333"/>
            <stop offset="100%" stop-color="#666666"/>
        </linearGradient>
    </defs>

    <!-- Document Base -->
    <rect x="40" y="30" width="120" height="130" rx="12" fill="url(#docGradient)" stroke="#e0e0e0" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Document Fold (Top Right) -->
    <path d="M120 30 L160 70 L120 70 Z" fill="#e0e0e0" opacity="0.6"/>
    <path d="M120 30 L160 70" stroke="#e0e0e0" stroke-width="2"/>
    <path d="M160 30 L160 70 L120 30 Z" fill="#ffffff"/> <!-- Masking the corner -->
    
    <!-- Text Lines (representing original image text) -->
    <g fill="url(#textGradient)" opacity="0.4">
        <rect x="55" y="55" width="80" height="6" rx="3"/>
        <rect x="55" y="75" width="90" height="6" rx="3"/>
        <rect x="55" y="95" width="70" height="6" rx="3"/>
        <rect x="55" y="115" width="85" height="6" rx="3"/>
    </g>

    <!-- Scanning Area -->
    <rect x="35" y="65" width="130" height="40" fill="url(#scanGradient)"/>
    
    <!-- Scan Line -->
    <line x1="35" y1="105" x2="165" y2="105" stroke="#0072ff" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Recognized Text (Clean, clear text emerging from the scan) -->
    <g fill="#0072ff">
        <rect x="55" y="70" width="80" height="6" rx="3"/>
        <rect x="55" y="90" width="90" height="6" rx="3"/>
    </g>

    <!-- Viewfinder / Lens Focus Corners -->
    <g stroke="#0072ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Top Left -->
        <path d="M50 45 L40 45 L40 55"/>
        <!-- Top Right -->
        <path d="M150 45 L160 45 L160 55"/>
        <!-- Bottom Left -->
        <path d="M40 135 L40 145 L50 145"/>
        <!-- Bottom Right -->
        <path d="M160 135 L160 145 L150 145"/>
    </g>
    
    <!-- Magnifying Glass / Extraction Symbol -->
    <circle cx="100" cy="105" r="14" fill="#ffffff" stroke="#0072ff" stroke-width="3" filter="url(#shadow)"/>
    <!-- OCR Text inside circle -->
    <text x="100" y="108.5" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0072ff" text-anchor="middle">OCR</text>
    
</svg>
