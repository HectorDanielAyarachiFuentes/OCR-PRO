<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente vertical para los soportes superiores (Cian arriba, Azul abajo) -->
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Gradiente vertical para los soportes inferiores (Cian abajo, Azul arriba) -->
    <linearGradient id="gradBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Gradiente para el pliegue superior -->
    <linearGradient id="flapGradTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <!-- Gradiente para el pliegue inferior -->
    <linearGradient id="flapGradBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <!-- Sombra suave para los pliegues 3D -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── SOPORTE: SUPERIOR IZQUIERDO (TL) ── -->
  <g>
    <!-- Base -->
    <path d="M 98 98 L 160 98 A 24 24 0 0 0 184 74 A 24 24 0 0 0 160 50 L 98 50 A 48 48 0 0 0 50 98 L 50 160 A 24 24 0 0 0 74 184 A 24 24 0 0 0 98 160 Z" fill="url(#gradTop)"/>
    <!-- Sombra del pliegue -->
    <path d="M 50 98 L 98 50 A 48 48 0 0 1 98 98 A 48 48 0 0 1 50 98 Z" fill="rgba(0, 0, 0, 0.15)" transform="translate(1, 2)"/>
    <!-- Pliegue doblado -->
    <path d="M 50 98 L 98 50 A 48 48 0 0 1 98 98 A 48 48 0 0 1 50 98 Z" fill="url(#flapGradTop)"/>
  </g>

  <!-- ── SOPORTE: SUPERIOR DERECHO (TR) ── -->
  <g>
    <!-- Base -->
    <path d="M 414 98 L 352 98 A 24 24 0 0 1 328 74 A 24 24 0 0 1 352 50 L 414 50 A 48 48 0 0 1 462 98 L 462 160 A 24 24 0 0 1 438 184 A 24 24 0 0 1 414 160 Z" fill="url(#gradTop)"/>
    <!-- Sombra del pliegue -->
    <path d="M 414 50 L 462 98 A 48 48 0 0 1 414 98 A 48 48 0 0 1 414 50 Z" fill="rgba(0, 0, 0, 0.15)" transform="translate(-1, 2)"/>
    <!-- Pliegue doblado -->
    <path d="M 414 50 L 462 98 A 48 48 0 0 1 414 98 A 48 48 0 0 1 414 50 Z" fill="url(#flapGradTop)"/>
  </g>

  <!-- ── SOPORTE: INFERIOR IZQUIERDO (BL) ── -->
  <g>
    <!-- Base -->
    <path d="M 98 414 L 160 414 A 24 24 0 0 1 184 438 A 24 24 0 0 1 160 462 L 98 462 A 48 48 0 0 1 50 414 L 50 352 A 24 24 0 0 1 74 328 A 24 24 0 0 1 98 352 Z" fill="url(#gradBottom)"/>
    <!-- Sombra del pliegue -->
    <path d="M 98 462 L 50 414 A 48 48 0 0 1 98 414 A 48 48 0 0 1 98 462 Z" fill="rgba(0, 0, 0, 0.15)" transform="translate(1, -2)"/>
    <!-- Pliegue doblado -->
    <path d="M 98 462 L 50 414 A 48 48 0 0 1 98 414 A 48 48 0 0 1 98 462 Z" fill="url(#flapGradBottom)"/>
  </g>

  <!-- ── SOPORTE: INFERIOR DERECHO (BR) ── -->
  <g>
    <!-- Base -->
    <path d="M 414 414 L 352 414 A 24 24 0 0 0 328 438 A 24 24 0 0 0 352 462 L 414 462 A 48 48 0 0 0 462 414 L 462 352 A 24 24 0 0 0 438 328 A 24 24 0 0 0 414 352 Z" fill="url(#gradBottom)"/>
    <!-- Sombra del pliegue -->
    <path d="M 462 414 L 414 462 A 48 48 0 0 1 414 414 A 48 48 0 0 1 462 414 Z" fill="rgba(0, 0, 0, 0.15)" transform="translate(-1, -2)"/>
    <!-- Pliegue doblado -->
    <path d="M 462 414 L 414 462 A 48 48 0 0 1 414 414 A 48 48 0 0 1 462 414 Z" fill="url(#flapGradBottom)"/>
  </g>

  <!-- ── LETRA 'A' CENTRAL ── -->
  <path d="M 230 150 L 282 150 L 370 340 L 316 340 L 295 290 L 217 290 L 196 340 L 142 340 Z M 256 185 L 282 250 L 230 250 Z" fill="#0072ff" filter="url(#softShadow)"/>
</svg>
